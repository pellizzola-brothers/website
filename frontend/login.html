<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Pellizzola Brothers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">🎮 Pellizzola Brothers</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="niveis.html">Níveis</a></li>
    <li><a href="login.html" class="active">Entrar</a></li>
  </ul>
</nav>

<div class="login-page">
  <div class="login-box">
    <div class="login-header">❖ Pellizzola Brothers</div>
    <div class="login-body">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login',this)">Login</button>
        <button class="tab" onclick="switchTab('register',this)">Cadastro</button>
      </div>

      <div class="panel active" id="panel-login">
        <div class="form-group">
          <label class="form-label">Usuário</label>
          <input class="form-input" id="login-user" type="text" placeholder="seu_usuario" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input class="form-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-green" style="width:100%;margin-top:4px;" onclick="doLogin()">Entrar</button>
        <div id="login-msg"></div>
      </div>

      <div class="panel" id="panel-register">
        <div class="form-group">
          <label class="form-label">Usuário</label>
          <input class="form-input" id="reg-user" type="text" placeholder="seu_usuario" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Bio <span style="font-weight:400;color:var(--text-dim);font-size:11px;text-transform:none;">(opcional)</span></label>
          <input class="form-input" id="reg-bio" type="text" placeholder="Uma frase sobre você...">
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input class="form-input" id="reg-pass" type="password" placeholder="Mínimo 4 caracteres" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar Senha</label>
          <input class="form-input" id="reg-pass2" type="password" placeholder="Repita a senha" autocomplete="new-password">
        </div>
        <button class="btn btn-green" style="width:100%;margin-top:4px;" onclick="doRegister()">Cadastrar</button>
        <div id="reg-msg"></div>
      </div>

      <div style="margin-top:18px;text-align:center;">
        <a href="index.html" style="font-size:13px;color:var(--text-dim);text-decoration:none;">← Voltar ao início</a>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:3000/api';
const existing = JSON.parse(sessionStorage.getItem('pb_user') || 'null');
if (existing) window.location.href = 'perfil_do_usuario.html?id=' + existing.id;

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

function showMsg(id, text, ok) {
  var el = document.getElementById(id);
  el.className = 'status-msg ' + (ok ? 'status-ok' : 'status-err');
  el.textContent = text;
}

async function doLogin() {
  var username = document.getElementById('login-user').value.trim();
  var password = document.getElementById('login-pass').value;
  if (!username || !password) { showMsg('login-msg','Preencha todos os campos.',false); return; }
  try {
    var res  = await fetch(API + '/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    var data = await res.json();
    if (!res.ok) { showMsg('login-msg', data.error, false); return; }
    sessionStorage.setItem('pb_user', JSON.stringify(data.user));
    showMsg('login-msg','Login realizado! Redirecionando...',true);
    setTimeout(function(){ window.location.href = 'perfil_do_usuario.html?id=' + data.user.id; }, 1200);
  } catch(e) { showMsg('login-msg','Erro de conexão com o servidor.',false); }
}

async function doRegister() {
  var username = document.getElementById('reg-user').value.trim();
  var bio      = document.getElementById('reg-bio').value.trim();
  var password = document.getElementById('reg-pass').value;
  var pass2    = document.getElementById('reg-pass2').value;
  if (!username || !password) { showMsg('reg-msg','Usuário e senha são obrigatórios.',false); return; }
  if (password !== pass2)     { showMsg('reg-msg','As senhas não coincidem.',false); return; }
  if (password.length < 4)    { showMsg('reg-msg','A senha deve ter pelo menos 4 caracteres.',false); return; }
  try {
    var res  = await fetch(API + '/auth/register', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,bio,password})});
    var data = await res.json();
    if (!res.ok) { showMsg('reg-msg', data.error, false); return; }
    showMsg('reg-msg','Conta criada! Faça login para continuar.',true);
    setTimeout(function(){ switchTab('login', document.querySelectorAll('.tab')[0]); }, 1500);
  } catch(e) { showMsg('reg-msg','Erro de conexão com o servidor.',false); }
}
</script>
</body>
</html>
