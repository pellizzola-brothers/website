<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Levels — Pellizzola Brothers</title>
  <link rel="stylesheet" href="style.css">
  <script src="i18n/pt_BR.js"></script>
  <script src="i18n/en.js"></script>
  <script src="i18n.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="cache.js"></script>
  <style>
    .filtros-wrap {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 16px;
    }
    .filtros-wrap select {
      padding: 8px 12px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: border-color .2s;
    }
    .filtros-wrap select:focus { outline: none; border-color: var(--accent); }
    .resultado-count { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .resultado-count strong { color: var(--text); }
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .list-title {
      font-family: var(--font-title);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .level-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 6px;
      transition: border-color .15s, background .15s, transform .1s;
      will-change: transform;
    }
    .level-row:hover { border-color: var(--accent); background: var(--bg-card2); transform: translateX(2px); }
    .level-row-thumb {
      width: 60px; height: 46px;
      background: linear-gradient(135deg, #1a4a1a 0%, #0a2040 100%);
      border-radius: var(--radius);
      border: 2px solid var(--border-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .level-row-info { flex: 1; min-width: 0; }
    .level-row-name {
      font-family: var(--font-title);
      font-size: 14px; font-weight: 700;
      letter-spacing: .5px; text-transform: uppercase;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .level-row-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .level-row-desc { font-size: 12px; color: var(--text-muted); font-style: italic; }
    .level-row-author { font-size: 11px; color: var(--text-dim); }
    .level-row-author::before { content: '· '; }
    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 7px; border-radius: 20px;
      font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
      margin-top: 4px;
    }
    .badge-ok   { background: rgba(61,158,66,.18); color: #4ab050; border: 1px solid rgba(61,158,66,.3); }
    .badge-none { background: rgba(255,255,255,.05); color: var(--text-dim); border: 1px solid var(--border); }
    .level-row-stats {
      display: flex; flex-direction: column; align-items: flex-end;
      gap: 3px; font-size: 12px; color: var(--text-muted);
      flex-shrink: 0; min-width: 54px; text-align: right;
    }
    .stat-hot { color: var(--yellow); font-weight: 700; }
    .btn-dl {
      width: 36px; height: 36px; padding: 0; font-size: 16px;
      background: var(--accent); color: #fff;
      border-radius: var(--radius);
      box-shadow: 0 2px 0 var(--accent-dark);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s, transform .1s;
    }
    .btn-dl:hover { background: #4ab050; }
    .btn-dl:active { transform: translateY(2px); box-shadow: none; }
    .btn-dl:disabled { opacity: .6; cursor: default; transform: none; }
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-top: 20px; flex-wrap: wrap;
    }
    .page-btn {
      padding: 7px 14px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-family: var(--font-title);
      font-size: 12px; font-weight: 700; letter-spacing: 1px;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
    .page-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
    .page-btn:disabled { opacity: .35; cursor: default; }
    .page-info { font-size: 12px; color: var(--text-dim); }
    #progress-bar {
      position: fixed; top: 50px; left: 0; right: 0; height: 3px;
      background: var(--accent); box-shadow: 0 0 8px var(--accent-glow);
      transform-origin: left; transform: scaleX(0);
      transition: transform .3s ease, opacity .3s;
      z-index: 500; opacity: 0;
    }
    #progress-bar.active { opacity: 1; }
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-nav); border: 2px solid var(--border-light);
      border-radius: var(--radius-lg); padding: 10px 20px;
      font-size: 13px; color: var(--text);
      opacity: 0; transition: opacity .2s, transform .2s;
      pointer-events: none; white-space: nowrap; z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, var(--border-light) 50%, var(--border) 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite;
      border-radius: var(--radius); display: block;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (max-width: 500px) {
      .level-row { padding: 10px 12px; gap: 10px; }
      .level-row-thumb { width: 46px; height: 38px; font-size: 18px; }
      .badge { display: none; }
    }

    /* ── Filtro Autor Component ── */
    .autor-filter-wrap { position: relative; }
    .autor-trigger {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px;
      background: var(--bg-card); border: 2px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-family: inherit; font-size: 13px; cursor: pointer;
      transition: border-color .2s; user-select: none; white-space: nowrap;
    }
    .autor-trigger:hover { border-color: var(--accent); }
    .autor-trigger.open  { border-color: var(--accent); }
    .autor-trigger-tags  { display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden; }
    .autor-tag {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 1px 7px; border-radius: 20px;
      background: rgba(61,158,66,.2); border: 1px solid rgba(61,158,66,.4);
      color: #4ab050; font-size: 11px; font-weight: 700;
    }
    .autor-tag-more {
      padding: 1px 7px; border-radius: 20px;
      background: rgba(255,255,255,.07); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 11px;
    }
    .autor-caret { margin-left: auto; color: var(--text-muted); font-size: 10px; }

    .autor-dropdown {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 400;
      background: var(--bg-card); border: 2px solid var(--border-light);
      border-radius: var(--radius-lg); min-width: 240px; max-width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,.6);
      display: none; flex-direction: column;
    }
    .autor-dropdown.open { display: flex; }

    .autor-search {
      margin: 8px 8px 4px;
      padding: 7px 10px;
      background: var(--bg-input); border: 2px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 13px; font-family: inherit;
    }
    .autor-search:focus { outline: none; border-color: var(--accent); }

    .autor-chips {
      display: flex; gap: 4px; flex-wrap: wrap; padding: 4px 8px;
    }
    .autor-chip {
      padding: 3px 9px; border-radius: 20px;
      background: var(--bg-card2); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 11px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
      transition: background .15s, color .15s, border-color .15s;
    }
    .autor-chip:hover  { border-color: var(--accent); color: var(--accent); }
    .autor-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .autor-list {
      max-height: 200px; overflow-y: auto;
      border-top: 1px solid var(--border); padding: 4px 0;
    }
    .autor-list::-webkit-scrollbar { width: 4px; }
    .autor-list::-webkit-scrollbar-track { background: transparent; }
    .autor-list::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

    .autor-option {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; cursor: pointer;
      transition: background .1s;
    }
    .autor-option:hover { background: rgba(255,255,255,.05); }
    .autor-option input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
    .autor-option-name { font-size: 13px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .autor-option-count { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }

    .autor-empty { padding: 14px 12px; text-align: center; font-size: 13px; color: var(--text-dim); font-style: italic; }

    .autor-pagination {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; border-top: 1px solid var(--border);
      font-size: 11px; color: var(--text-dim);
    }
    .autor-pg-btn {
      background: none; border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-muted);
      padding: 2px 9px; font-size: 11px; cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .autor-pg-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .autor-pg-btn:disabled { opacity: .3; cursor: default; }

    .autor-footer {
      display: flex; gap: 6px; padding: 8px;
      border-top: 1px solid var(--border);
    }
    .autor-footer-btn {
      flex: 1; padding: 7px; border-radius: var(--radius);
      font-family: var(--font-title); font-size: 11px; font-weight: 700;
      letter-spacing: .5px; text-transform: uppercase; cursor: pointer; border: none;
    }
    .autor-footer-limpar { background: var(--bg-card2); color: var(--text-muted); }
    .autor-footer-limpar:hover { color: var(--text); }
    .autor-footer-aplicar { background: var(--accent); color: #fff; }
    .autor-footer-aplicar:hover { background: #4ab050; }
  </style>
</head>
<body>

<div id="progress-bar"></div>
<div id="toast"></div>

<nav>
  <a href="index.html" class="nav-brand">🎮 Pellizzola Brothers</a>
  <ul class="nav-links">
    <li><a href="index.html" data-i18n="nav.home">Home</a></li>
    <li><a href="levels.html" class="active" data-i18n="nav.fases">Fases</a></li>
    <li><a href="usuarios.html" data-i18n="nav.criadores">Criadores</a></li>
    <li><a href="login.html" id="nav-auth" data-i18n="nav.entrar">Entrar</a></li>
    <li>
      <form class="nav-search-form" onsubmit="navSearch(event)">
        <input class="nav-search-input" id="nav-search" type="text" data-i18n-ph="nav.buscar" placeholder="🔍 Buscar fases..." autocomplete="off">
      </form>
    </li>
  </ul>
</nav>

<div class="page">

  <div class="search-bar-wrap" style="margin-bottom:14px;">
    <span class="search-icon">🔍</span>
    <input class="search-bar" id="searchInput" type="text"
           data-i18n-ph="levels.pesquisar_placeholder"
           placeholder="Pesquisar por nome, descrição ou autor..."
           autocomplete="off" spellcheck="false">
  </div>

  <div class="filtros-wrap">
    <!-- Filtro de autor: componente multi-select -->
    <div class="autor-filter-wrap" id="autorFilter">
      <div class="autor-trigger" id="autorTrigger" onclick="autorToggle()">
        <span id="autorTriggerLabel">👤 Todos os autores</span>
        <div class="autor-trigger-tags" id="autorTriggerTags" style="display:none;"></div>
        <span class="autor-caret" id="autorCaret">▼</span>
      </div>
      <div class="autor-dropdown" id="autorDropdown">
        <input class="autor-search" id="autorSearch" type="text"
               data-i18n-ph="levels.buscar_autor"
               placeholder="🔍 Buscar autor..." autocomplete="off"
               oninput="autorFiltrarLista()" onclick="event.stopPropagation()">
        <div class="autor-chips" id="autorChips">
          <span class="autor-chip active" id="chip-todos" onclick="autorChipTodos()" data-i18n="levels.chip_todos">Todos</span>
          <span class="autor-chip" id="chip-com-levels" onclick="autorChipComLevels()" data-i18n="levels.chip_com_fases">Com fases</span>
          <span class="autor-chip" id="chip-top5" onclick="autorChipTop5()" data-i18n="levels.chip_top5">Top 5</span>
        </div>
        <div class="autor-list" id="autorList"></div>
        <div class="autor-pagination" id="autorPagination" style="display:none;">
          <button class="autor-pg-btn" id="autorPgPrev" onclick="autorPgAnterior()">← Ant.</button>
          <span id="autorPgInfo"></span>
          <button class="autor-pg-btn" id="autorPgNext" onclick="autorPgProxima()">Próx. →</button>
        </div>
        <div class="autor-footer">
          <button class="autor-footer-btn autor-footer-limpar" onclick="autorLimpar()" data-i18n="levels.limpar">Limpar</button>
          <button class="autor-footer-btn autor-footer-aplicar" onclick="autorApply()" data-i18n="levels.aplicar">Aplicar</button>
        </div>
      </div>
    </div>

    <select id="filtroArquivo">
      <option value="" data-i18n="levels.filtro_todos">📦 Todos</option>
      <option value="sim" data-i18n="levels.filtro_com_arq">✅ Com arquivo</option>
      <option value="nao" data-i18n="levels.filtro_sem_arq">⚠️ Sem arquivo</option>
    </select>
    <select id="ordenacao">
      <option value="downloads" data-i18n="levels.ordem_downloads">⬇ Mais baixados</option>
      <option value="likes" data-i18n="levels.ordem_likes">♥ Mais curtidos</option>
      <option value="nome" data-i18n="levels.ordem_nome">🔤 A → Z</option>
      <option value="recentes" data-i18n="levels.ordem_recentes">🕐 Mais recentes</option>
    </select>
  </div>

  <div class="list-header">
    <div id="resultado-count" class="resultado-count" style="display:none;"></div>
    <div class="list-title" id="list-title" data-i18n="levels.todos">Todas as fases</div>
  </div>

  <div id="levels-list">
    <div class="level-row">
      <div class="level-row-thumb skeleton"></div>
      <div class="level-row-info">
        <span class="skeleton" style="height:13px;width:55%;display:block;margin-bottom:7px;"></span>
        <span class="skeleton" style="height:11px;width:38%;display:block;"></span>
      </div>
    </div>
    <div class="level-row">
      <div class="level-row-thumb skeleton"></div>
      <div class="level-row-info">
        <span class="skeleton" style="height:13px;width:45%;display:block;margin-bottom:7px;"></span>
        <span class="skeleton" style="height:11px;width:30%;display:block;"></span>
      </div>
    </div>
    <div class="level-row">
      <div class="level-row-thumb skeleton"></div>
      <div class="level-row-info">
        <span class="skeleton" style="height:13px;width:65%;display:block;margin-bottom:7px;"></span>
        <span class="skeleton" style="height:11px;width:42%;display:block;"></span>
      </div>
    </div>
  </div>

  <div id="empty-state" class="empty-state" style="display:none;" data-i18n="levels.nenhum_encontrado">😕 Nenhuma fase encontrada.</div>
  <div class="pagination" id="pagination" style="display:none;"></div>

</div>

<script>
'use strict';

/* ── CONSTANTES ── */
const EMOJIS      = ['🌴','🎯','🎵','⭐','🏆','🍄','🎮','🔷','🧩','🎪'];
const POR_PAGINA  = 20;
const CACHE_TTL   = 2 * 60 * 1000;
const DEBOUNCE_MS = 250;

const emojiFor = id => EMOJIS[((id - 1) % EMOJIS.length + EMOJIS.length) % EMOJIS.length];

let todosLevels     = [];
let levelsFiltrados = [];
let paginaAtual     = 1;
let debounceTimer   = null;

/* ── SESSÃO ── */
const user = getUser();
if (user) {
  const el = document.getElementById('nav-auth');
  el.textContent = user.username.toUpperCase();
  el.href = 'perfil_do_usuario.html?id=' + user.id;
}

/* ── UTILS ── */
function showToast(msg, ms) {
  ms = ms || 2200;
  const t_el = document.getElementById('toast');
  t_el.textContent = msg;
  t_el.classList.add('show');
  setTimeout(function() { t_el.classList.remove('show'); }, ms);
}

function setProgress(pct) {
  const bar = document.getElementById('progress-bar');
  if (pct >= 100) {
    bar.style.transform = 'scaleX(1)';
    setTimeout(function() { bar.classList.remove('active'); bar.style.transform = 'scaleX(0)'; }, 300);
  } else {
    bar.classList.add('active');
    bar.style.transform = 'scaleX(' + (pct / 100) + ')';
  }
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ── FILTER STATE (sessionStorage) ── */
var _filterStateKey = 'pb_levels_filter_state';

function saveFilterState() {
  try {
    sessionStorage.setItem(_filterStateKey, JSON.stringify({
      q: document.getElementById('searchInput').value,
      arquivo: document.getElementById('filtroArquivo').value,
      ordem: document.getElementById('ordenacao').value,
      autores: autorGetSelected()
    }));
  } catch(e) {}
}

function restoreFilterState() {
  try {
    var raw = sessionStorage.getItem(_filterStateKey);
    if (!raw) return;
    var state = JSON.parse(raw);
    if (state.q) document.getElementById('searchInput').value = state.q;
    if (state.arquivo) document.getElementById('filtroArquivo').value = state.arquivo;
    if (state.ordem) document.getElementById('ordenacao').value = state.ordem;
    window._pendingAutores = Array.isArray(state.autores) ? state.autores : [];
  } catch(e) {}
}

function limparBusca(e) {
  e.preventDefault();
  document.getElementById('searchInput').value = '';
  aplicarFiltros();
}

/* ════════════════════════════════════════════════════════════
   COMPONENTE: FILTRO DE AUTOR (multi-select com busca)
════════════════════════════════════════════════════════════ */

/* ── Estado interno ── */
var _autorTodos        = [];   // [{name, count}] — todos os autores únicos
var _autorFiltrados    = [];   // após busca interna no dropdown
var _autorSelecionados = [];   // string[] — autores selecionados
var _autorPg           = 1;
var _autorPorPg        = 5;
var _autorAberto       = false;

/* ── Inicializa com o array de levels ── */
function autorInit(levels) {
  var mapa = {};
  levels.forEach(function(l) {
    mapa[l.author_name] = (mapa[l.author_name] || 0) + 1;
  });
  _autorTodos = Object.keys(mapa).sort().map(function(n) {
    return { name: n, count: mapa[n] };
  });
  _autorSelecionados = [];
  _autorPg = 1;
  _autorFiltrados = _autorTodos.slice();
  _autorRenderLista();
  _autorAtualizarTrigger();
}

/* ── Abre/fecha dropdown ── */
function autorToggle() {
  _autorAberto = !_autorAberto;
  var dd = document.getElementById('autorDropdown');
  var tr = document.getElementById('autorTrigger');
  dd.classList.toggle('open', _autorAberto);
  tr.classList.toggle('open', _autorAberto);
  document.getElementById('autorCaret').textContent = _autorAberto ? '▲' : '▼';
  if (_autorAberto) {
    document.getElementById('autorSearch').value = '';
    _autorFiltrados = _autorTodos.slice();
    _autorPg = 1;
    _autorRenderLista();
    setTimeout(function() { document.getElementById('autorSearch').focus(); }, 60);
  }
}

/* ── Filtra a lista interna pelo campo de busca ── */
function autorFiltrarLista() {
  var q = document.getElementById('autorSearch').value.toLowerCase().trim();
  _autorFiltrados = q
    ? _autorTodos.filter(function(a) { return a.name.toLowerCase().indexOf(q) !== -1; })
    : _autorTodos.slice();
  _autorPg = 1;
  _autorRenderLista();
}

/* ── Chips rápidos ── */
function autorChipTodos() {
  _autorSelecionados = [];
  _autorRenderLista();
  _autorAtualizarTrigger();
  _autorAtivarChip('chip-todos');
}
function autorChipComLevels() {
  _autorSelecionados = _autorTodos.filter(function(a) { return a.count > 0; }).map(function(a) { return a.name; });
  _autorRenderLista();
  _autorAtualizarTrigger();
  _autorAtivarChip('chip-com-levels');
}
function autorChipTop5() {
  var sorted = _autorTodos.slice().sort(function(a, b) { return b.count - a.count; });
  _autorSelecionados = sorted.slice(0, 5).map(function(a) { return a.name; });
  _autorRenderLista();
  _autorAtualizarTrigger();
  _autorAtivarChip('chip-top5');
}
function _autorAtivarChip(id) {
  ['chip-todos','chip-com-levels','chip-top5'].forEach(function(c) {
    document.getElementById(c).classList.toggle('active', c === id);
  });
}

/* ── Toggle de seleção de um autor ── */
function autorToggleOpcao(nome) {
  var idx = _autorSelecionados.indexOf(nome);
  if (idx === -1) _autorSelecionados.push(nome);
  else _autorSelecionados.splice(idx, 1);
  _autorRenderLista();
  _autorAtualizarTrigger();
  // Remove destaque dos chips quando seleção muda manualmente
  ['chip-todos','chip-com-levels','chip-top5'].forEach(function(c) {
    document.getElementById(c).classList.remove('active');
  });
  if (_autorSelecionados.length === 0) document.getElementById('chip-todos').classList.add('active');
}

/* ── Limpar seleção ── */
function autorLimpar() {
  _autorSelecionados = [];
  _autorRenderLista();
  _autorAtualizarTrigger();
  _autorAtivarChip('chip-todos');
}

/* ── Paginação interna ── */
function autorPgAnterior() { if (_autorPg > 1) { _autorPg--; _autorRenderLista(); } }
function autorPgProxima() {
  var total = Math.ceil(_autorFiltrados.length / _autorPorPg);
  if (_autorPg < total) { _autorPg++; _autorRenderLista(); }
}

/* ── Renderiza a lista de opções ── */
function _autorRenderLista() {
  var lista = document.getElementById('autorList');
  var pgEl  = document.getElementById('autorPagination');
  var total = Math.ceil(_autorFiltrados.length / _autorPorPg);
  var ini   = (_autorPg - 1) * _autorPorPg;
  var fim   = Math.min(ini + _autorPorPg, _autorFiltrados.length);
  var page  = _autorFiltrados.slice(ini, fim);

  if (!page.length) {
    lista.innerHTML = '<div class="autor-empty">' + t('levels.nenhum_autor') + '</div>';
    pgEl.style.display = 'none';
    return;
  }

  lista.innerHTML = page.map(function(a) {
    var checked = _autorSelecionados.indexOf(a.name) !== -1;
    return '<label class="autor-option">' +
      '<input type="checkbox" ' + (checked ? 'checked' : '') +
        ' onchange="autorToggleOpcao(' + JSON.stringify(a.name) + ')" onclick="event.stopPropagation()">' +
      '<span class="autor-option-name">' + escHtml(a.name) + '</span>' +
      '<span class="autor-option-count">(' + a.count + ')</span>' +
    '</label>';
  }).join('');

  if (total > 1) {
    pgEl.style.display = '';
    document.getElementById('autorPgInfo').textContent = _autorPg + '/' + total;
    document.getElementById('autorPgPrev').disabled = _autorPg <= 1;
    document.getElementById('autorPgNext').disabled = _autorPg >= total;
  } else {
    pgEl.style.display = 'none';
  }
}

/* ── Atualiza o texto do trigger ── */
function _autorAtualizarTrigger() {
  var label = document.getElementById('autorTriggerLabel');
  var tags  = document.getElementById('autorTriggerTags');
  var sel   = _autorSelecionados;

  if (!sel.length) {
    label.style.display = '';
    label.textContent   = t('levels.todos_autores');
    tags.style.display  = 'none';
    tags.innerHTML      = '';
    return;
  }
  label.style.display = 'none';
  tags.style.display  = '';
  var MAX_VIS = 2;
  var html = sel.slice(0, MAX_VIS).map(function(n) {
    return '<span class="autor-tag">👤 ' + escHtml(n) + '</span>';
  }).join('');
  if (sel.length > MAX_VIS) {
    html += '<span class="autor-tag-more">+' + (sel.length - MAX_VIS) + '</span>';
  }
  tags.innerHTML = html;
}

/* ── API pública ── */
function autorGetSelected() { return _autorSelecionados.slice(); }

function autorApply() {
  if (_autorAberto) autorToggle();
  // Fecha o dropdown e dispara o filtro
  aplicarFiltros();
}

/* Fecha ao clicar fora */
document.addEventListener('click', function(e) {
  if (_autorAberto && !document.getElementById('autorFilter').contains(e.target)) {
    _autorAberto = false;
    document.getElementById('autorDropdown').classList.remove('open');
    document.getElementById('autorTrigger').classList.remove('open');
    document.getElementById('autorCaret').textContent = '▼';
  }
});

/* ── FETCH ── */
async function carregarNiveis() {
  setProgress(20);
  var cached = cacheLoad('pb_niveis_v2', CACHE_TTL);
  if (cached) {
    todosLevels = cached;
    setProgress(100);
    autorInit(todosLevels);
    if (window._pendingAutores && window._pendingAutores.length) {
      _autorSelecionados = window._pendingAutores.filter(function(n) {
        return _autorTodos.some(function(a) { return a.name === n; });
      });
      _autorAtualizarTrigger();
      window._pendingAutores = [];
    }
    aplicarFiltros();
    return;
  }
  try {
    setProgress(45);
    var resp = await fetch(API + '/levels');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    todosLevels = await resp.json();
    cacheSave('pb_niveis_v2', todosLevels);
    setProgress(100);
  } catch(err) {
    todosLevels = [
      {id:1,name:'Meu Nivel Bacana',description:'Bacanices Bananas',downloads:11,likes:10,author_name:'xx_poste_xx',author_id:1,file_id:1},
      {id:2,name:'Meu Nivel Bacana 2',description:'Os dentes de Berenice',downloads:11,likes:9,author_name:'xx_poste_xx',author_id:1,file_id:2},
      {id:3,name:'A Extraordinaria Jornada de Henrique',description:'Um clássico!',downloads:0,likes:0,author_name:'BillyShears',author_id:3,file_id:null},
      {id:4,name:'Revolver',description:'The one and only Billy Shears!',downloads:8,likes:6,author_name:'BillyShears',author_id:3,file_id:null},
      {id:5,name:'Eu Acompanho as Botas Douradas',description:'Bacanices',downloads:3,likes:2,author_name:'JacaboMassola',author_id:2,file_id:null},
    ];
    setProgress(100);
    showToast(t('levels.offline'));
  }
  autorInit(todosLevels);
  // Restore persisted author selection (must run after autorInit sets _autorTodos)
  if (window._pendingAutores && window._pendingAutores.length) {
    _autorSelecionados = window._pendingAutores.filter(function(n) {
      return _autorTodos.some(function(a) { return a.name === n; });
    });
    _autorAtualizarTrigger();
    window._pendingAutores = [];
  }
  aplicarFiltros();
}

/* ── FILTROS ── */
function onBuscaInput() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(aplicarFiltros, DEBOUNCE_MS);
}

function aplicarFiltros() {
  saveFilterState();
  var q       = document.getElementById('searchInput').value.toLowerCase().trim();
  var autoresSelecionados = autorGetSelected();
  var arquivo = document.getElementById('filtroArquivo').value;
  var ordem   = document.getElementById('ordenacao').value;

  levelsFiltrados = todosLevels.filter(function(l) {
    var buscaOk = !q ||
      l.name.toLowerCase().indexOf(q) !== -1 ||
      (l.description || '').toLowerCase().indexOf(q) !== -1 ||
      l.author_name.toLowerCase().indexOf(q) !== -1;
    var autorOk = autoresSelecionados.length === 0 || autoresSelecionados.indexOf(l.author_name) !== -1;
    var arqOk   = !arquivo || (arquivo === 'sim' ? !!l.file_id : !l.file_id);
    return buscaOk && autorOk && arqOk;
  });

  levelsFiltrados.sort(function(a, b) {
    if (ordem === 'downloads') return b.downloads - a.downloads;
    if (ordem === 'likes')     return b.likes - a.likes;
    if (ordem === 'nome')      return a.name.localeCompare(b.name, 'pt-BR');
    if (ordem === 'recentes')  return b.id - a.id;
    return 0;
  });

  var countEl = document.getElementById('resultado-count');
  var titleEl = document.getElementById('list-title');
  if (q || autoresSelecionados.length > 0 || arquivo) {
    countEl.style.display = '';
    countEl.innerHTML = '<strong>' + levelsFiltrados.length + '</strong> ' +
      (levelsFiltrados.length !== 1 ? t('levels.encontrados_plural') : t('levels.encontrados_singular'));
    titleEl.style.display = 'none';
    var titleParts = [];
    if (q) titleParts.push('"' + q + '"');
    if (autoresSelecionados.length > 0) titleParts.push(t('levels.por') + ' ' + autoresSelecionados.join(', '));
    document.title = t('entity.fases') + (titleParts.length ? ' — ' + titleParts.join(', ') : '') + ' — Pellizzola Brothers';
  } else {
    countEl.style.display = 'none';
    titleEl.style.display = '';
    titleEl.textContent = t('levels.todos') + ' (' + levelsFiltrados.length + ')';
    document.title = t('levels.titulo_pagina');
  }

  paginaAtual = 1;
  renderizarPagina();
}

/* ── PAGINAÇÃO ── */
function renderizarPagina() {
  var totalPaginas = Math.max(1, Math.ceil(levelsFiltrados.length / POR_PAGINA));
  paginaAtual = Math.min(paginaAtual, totalPaginas);
  var inicio = (paginaAtual - 1) * POR_PAGINA;
  var fim    = Math.min(inicio + POR_PAGINA, levelsFiltrados.length);
  renderLevels(levelsFiltrados.slice(inicio, fim));
  renderizarPaginacao(totalPaginas);
}

/* ── RENDER COM FRAGMENT ── */
function renderLevels(niveis) {
  var empty = document.getElementById('empty-state');
  var list  = document.getElementById('levels-list');
  if (!niveis.length) {
    list.innerHTML = '';
    var q = document.getElementById('searchInput').value.trim();
    if (q) {
      empty.innerHTML = '😕 ' + t('levels.nenhum_encontrado').replace('.','') + ' com o nome &ldquo;' + escHtml(q) + '&rdquo;. <a href="#" onclick="limparBusca(event)" style="color:var(--accent);text-decoration:underline;">Ver todos</a>';
    } else {
      empty.innerHTML = t('levels.nenhum_encontrado');
    }
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  requestAnimationFrame(function() {
    var frag = document.createDocumentFragment();
    niveis.forEach(function(l, idx) {
      var isHot  = l.downloads >= 10;
      var temArq = !!l.file_id;
      var link = document.createElement('a');
      link.href = 'perfil_do_jogo.html?id=' + l.id;
      link.className = 'level-row-link card-anim';
      link.style.animationDelay = (idx % 10 * 0.04) + 's';
      link.innerHTML =
        '<div class="level-row">' +
          '<div class="level-row-thumb">' + emojiFor(l.id) + '</div>' +
          '<div class="level-row-info">' +
            '<div class="level-row-name">' + escHtml(l.name) + '</div>' +
            '<div class="level-row-meta">' +
              (l.description ? '<span class="level-row-desc">&ldquo;' + escHtml(l.description) + '&rdquo;</span>' : '') +
              '<span class="level-row-author">' + escHtml(l.author_name) + '</span>' +
            '</div>' +
            '<span class="badge ' + (temArq ? 'badge-ok' : 'badge-none') + '">' +
            (temArq ? t('levels.disponivel') : t('levels.sem_arquivo')) +
          '</span>' +
          '</div>' +
          '<div class="level-row-stats" id="stats-' + l.id + '">' +
            '<span class="' + (isHot ? 'stat-hot' : '') + '">⬇ ' + l.downloads + '</span>' +
            '<span>♥ ' + l.likes + '</span>' +
            (l.comment_count ? '<span>💬 ' + parseInt(l.comment_count) + '</span>' : '') +
          '</div>' +
          '<button class="btn-dl" onclick="handleDl(event,' + l.id + ',' + (l.file_id || 'null') + ',this,\'stats-' + l.id + '\')" title="' + t('levels.baixar_title') + '">⬇</button>' +
        '</div>';
      frag.appendChild(link);
    });
    list.innerHTML = '';
    list.appendChild(frag);
  });
}

/* ── BOTÕES DE PÁGINA ── */
function renderizarPaginacao(total) {
  var cont = document.getElementById('pagination');
  if (total <= 1) { cont.style.display = 'none'; return; }
  cont.style.display = 'flex';

  var janela = 2;
  var ini = Math.max(1, paginaAtual - janela);
  var fim = Math.min(total, paginaAtual + janela);
  if (fim - ini < 4) { if (ini === 1) fim = Math.min(total, ini + 4); else ini = Math.max(1, fim - 4); }

  var frag = document.createDocumentFragment();

  function mkBtn(label, pg, disabled, active) {
    var b = document.createElement('button');
    b.className = 'page-btn' + (active ? ' active' : '');
    b.textContent = label; b.disabled = disabled;
    if (!disabled && !active) b.onclick = function() { irParaPagina(pg); };
    return b;
  }

  frag.appendChild(mkBtn(t('levels.anterior'), paginaAtual - 1, paginaAtual === 1, false));
  if (ini > 1) {
    frag.appendChild(mkBtn('1', 1, false, false));
    if (ini > 2) { var d1 = document.createElement('span'); d1.className = 'page-info'; d1.textContent = '…'; frag.appendChild(d1); }
  }
  for (var i = ini; i <= fim; i++) frag.appendChild(mkBtn(String(i), i, false, i === paginaAtual));
  if (fim < total) {
    if (fim < total - 1) { var d2 = document.createElement('span'); d2.className = 'page-info'; d2.textContent = '…'; frag.appendChild(d2); }
    frag.appendChild(mkBtn(String(total), total, false, false));
  }
  frag.appendChild(mkBtn(t('levels.proxima'), paginaAtual + 1, paginaAtual === total, false));

  cont.innerHTML = '';
  cont.appendChild(frag);
}

function irParaPagina(pg) {
  paginaAtual = pg;
  renderizarPagina();
  document.getElementById('levels-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ── DOWNLOAD (otimista + fire-and-forget) ── */
async function handleDl(e, id, fileId, btn, statsId) {
  e.preventDefault(); e.stopPropagation();
  btn.textContent = '⏳'; btn.disabled = true;

  var statsEl = document.getElementById(statsId);
  if (statsEl) {
    var span = statsEl.querySelector('span');
    if (span) {
      var atual = parseInt(span.textContent.replace('⬇ ', '')) || 0;
      span.textContent = '⬇ ' + (atual + 1);
      if (atual + 1 >= 10) span.classList.add('stat-hot');
    }
  }
  var nivel = todosLevels.find(function(l) { return l.id === id; });
  if (nivel) nivel.downloads++;
  sessionStorage.removeItem('pb_niveis_v2');

  fetch(API + '/levels/' + id + '/download', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(user ? { user_id: user.id } : {})
  }).catch(function() {});

  if (!fileId) {
    showToast(t('levels.dl_sem_arquivo'));
    btn.textContent = '⬇'; btn.disabled = false;
    return;
  }

  try {
    var resp = await fetch(API + '/files/' + fileId);
    if (!resp.ok) {
      showToast(t('levels.dl_nao_encontrado'));
      btn.textContent = '⬇'; btn.style.background = ''; btn.disabled = false;
      return;
    }
    var dados = await resp.json();
    if (dados && !dados.error) {
      var a = document.createElement('a');
      a.href = API + '/upload/level/' + dados.hash;
      a.download = dados.hash;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      showToast(t('levels.dl_iniciado'));
    } else {
      showToast(t('levels.dl_nao_encontrado'));
    }
    btn.textContent = '✓'; btn.style.background = '#2d7a30';
    setTimeout(function() { btn.textContent = '⬇'; btn.style.background = ''; btn.disabled = false; }, 2500);
  } catch(err) {
    showToast(t('levels.dl_falha'));
    btn.textContent = '⬇'; btn.style.background = ''; btn.disabled = false;
  }
}

/* ── EVENTOS ── */
document.getElementById('searchInput').addEventListener('input', onBuscaInput);
document.getElementById('filtroArquivo').addEventListener('change', aplicarFiltros);
document.getElementById('ordenacao').addEventListener('change', aplicarFiltros);
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { e.target.value = ''; aplicarFiltros(); }
});

(function() {
  var urlQ = new URLSearchParams(location.search).get('q');
  if (urlQ) {
    // URL query param takes priority — skip restoring saved state
    var si = document.getElementById('searchInput');
    if (si) si.value = urlQ;
  } else {
    restoreFilterState();
  }
})();

carregarNiveis();

function navSearch(e) {
  e.preventDefault();
  var q = document.getElementById('nav-search').value.trim();
  if (q) window.location.href = 'levels.html?q=' + encodeURIComponent(q);
}
