<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Nível — Pellizzola Brothers</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .upload-card {
      max-width: 560px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
    }

    .upload-card h1 {
      font-family: var(--font-title);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text);
      margin: 0 0 24px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }

    .campo label {
      font-family: var(--font-title);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .campo input[type="text"],
    .campo textarea {
      padding: 9px 12px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      transition: border-color .2s;
    }

    .campo input[type="text"]:focus,
    .campo textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .campo textarea {
      resize: vertical;
      min-height: 80px;
    }

    .drop-zone {
      border: 2px dashed var(--border-light);
      border-radius: var(--radius);
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: background .2s, border-color .2s;
      position: relative;
    }

    .drop-zone.over {
      background: rgba(var(--accent-rgb, 100,180,255), 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    .drop-zone.has-file {
      background: rgba(45,122,48, 0.1);
      border-color: #2d7a30;
      color: #2d7a30;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-zone .icon {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 8px;
    }

    .drop-zone .file-name {
      font-weight: bold;
      word-break: break-all;
    }

    .progress-wrap {
      display: none;
      margin-top: 10px;
    }

    .progress-wrap progress {
      width: 100%;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      accent-color: var(--accent);
      border: none;
    }

    .progress-wrap span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: var(--radius);
      display: none;
      font-size: 14px;
    }

    .msg.ok {
      background: rgba(45,122,48,0.15);
      border: 1px solid #2d7a30;
      color: #5dba60;
    }

    .msg.erro {
      background: rgba(200,50,50,0.15);
      border: 1px solid #c03232;
      color: #e07070;
    }

    .link-nivel {
      display: block;
      margin-top: 8px;
      font-weight: bold;
      color: var(--yellow);
      text-decoration: none;
    }

    .aviso-login {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
    }

    .aviso-login a {
      color: var(--yellow);
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">🎮 Pellizzola Brothers</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="niveis.html">Níveis</a></li>
    <li><a href="login.html" id="nav-auth">Entrar</a></li>
  </ul>
</nav>

<div class="page">
  <div class="upload-card">
    <h1>📤 Enviar Nível</h1>

    <p id="aviso-login" class="aviso-login" style="display:none;">
      Você precisa estar <a href="login.html">logado</a> para enviar um nível.
    </p>

    <div id="form-upload">
      <div class="campo">
        <label for="nome">Nome do nível *</label>
        <input type="text" id="nome" placeholder="Ex: Meu Nivel Incrivel" maxlength="200">
      </div>

      <div class="campo">
        <label for="desc">Descrição</label>
        <textarea id="desc" placeholder="Conte um pouco sobre o nível..." maxlength="1000"></textarea>
      </div>

      <div class="campo">
        <label>Arquivo do nível *</label>
        <div class="drop-zone" id="drop-zone">
          <input type="file" id="arquivo" accept="*/*">
          <span class="icon">📁</span>
          <span id="drop-texto">Clique ou arraste o arquivo aqui</span>
        </div>
      </div>

      <div class="progress-wrap" id="progress-wrap">
        <progress id="barra" value="0" max="100"></progress>
        <span id="pct">0%</span>
      </div>

      <button class="btn btn-green" style="width:100%;margin-top:4px;" id="btn-enviar" onclick="enviar()">
        Enviar Nível
      </button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
var usuario = JSON.parse(sessionStorage.getItem('pb_user') || 'null');

if (usuario != null) {
  document.getElementById('nav-auth').textContent = usuario.username.toUpperCase();
  document.getElementById('nav-auth').href = 'perfil_do_usuario.html?id=' + usuario.id;
} else {
  document.getElementById('form-upload').style.display = 'none';
  document.getElementById('aviso-login').style.display = '';
}

// ── Drag & drop visual ────────────────────────────────────
var dropZone = document.getElementById('drop-zone');
var inputArq = document.getElementById('arquivo');

dropZone.addEventListener('dragover', function(e) {
  e.preventDefault();
  dropZone.classList.add('over');
});

dropZone.addEventListener('dragleave', function() {
  dropZone.classList.remove('over');
});

dropZone.addEventListener('drop', function(e) {
  e.preventDefault();
  dropZone.classList.remove('over');
  if (e.dataTransfer.files.length > 0) {
    inputArq.files = e.dataTransfer.files;
    mostrarArquivo(e.dataTransfer.files[0]);
  }
});

inputArq.addEventListener('change', function() {
  if (inputArq.files.length > 0) mostrarArquivo(inputArq.files[0]);
});

function mostrarArquivo(file) {
  dropZone.classList.add('has-file');
  dropZone.classList.remove('over');
  document.getElementById('drop-texto').innerHTML =
    '<span class="file-name">' + file.name + '</span>' +
    '<br><small>' + (file.size / 1024).toFixed(1) + ' KB</small>';
}

// ── Envio com XMLHttpRequest (barra de progresso) ─────────
function enviar() {
  var nome    = document.getElementById('nome').value.trim();
  var desc    = document.getElementById('desc').value.trim();
  var arquivo = inputArq.files[0];

  if (!nome)    { mostrarMsg('erro', 'Preencha o nome do nível.'); return; }
  if (!arquivo) { mostrarMsg('erro', 'Selecione um arquivo.'); return; }

  var formData = new FormData();
  formData.append('file',        arquivo);
  formData.append('name',        nome);
  formData.append('description', desc);
  formData.append('author_id',   usuario.id);

  var btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  var progressWrap = document.getElementById('progress-wrap');
  var barra = document.getElementById('barra');
  var pct   = document.getElementById('pct');
  progressWrap.style.display = '';

  var xhr = new XMLHttpRequest();

  xhr.upload.addEventListener('progress', function(e) {
    if (e.lengthComputable) {
      var percent = Math.round((e.loaded / e.total) * 100);
      barra.value = percent;
      pct.textContent = percent + '%';
    }
  });

  xhr.addEventListener('load', function() {
    btn.disabled = false;
    btn.textContent = 'Enviar Nível';
    progressWrap.style.display = 'none';

    var dados;
    try { dados = JSON.parse(xhr.responseText); } catch(e) { dados = {}; }

    if (xhr.status === 201 && dados.ok) {
      mostrarMsg('ok',
        '✅ Nível <strong>' + dados.level.name + '</strong> enviado com sucesso!' +
        '<a class="link-nivel" href="perfil_do_jogo.html?id=' + dados.level.id + '">Ver nível →</a>'
      );
      document.getElementById('nome').value = '';
      document.getElementById('desc').value = '';
      inputArq.value = '';
      dropZone.classList.remove('has-file');
      document.getElementById('drop-texto').innerHTML = 'Clique ou arraste o arquivo aqui';
    } else {
      mostrarMsg('erro', 'Erro: ' + (dados.error || 'Falha no servidor.'));
    }
  });

  xhr.addEventListener('error', function() {
    btn.disabled = false;
    btn.textContent = 'Enviar Nível';
    progressWrap.style.display = 'none';
    mostrarMsg('erro', 'Erro de conexão. Verifique se o servidor está rodando.');
  });

  xhr.open('POST', 'http://localhost:3000/api/upload/level');
  xhr.send(formData);
}

function mostrarMsg(tipo, html) {
  var el = document.getElementById('msg');
  el.className = 'msg ' + tipo;
  el.innerHTML = html;
  el.style.display = '';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
</script>
</body>
</html>
