<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Level — Pellizzola Brothers</title>
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js"></script>
  <style>
    .upload-card {
      max-width: 560px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
    }

    .upload-card h1 {
      font-family: var(--font-title);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text);
      margin: 0 0 24px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }

    .campo label {
      font-family: var(--font-title);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .campo input[type="text"],
    .campo textarea {
      padding: 9px 12px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      transition: border-color .2s;
    }

    .campo input[type="text"]:focus,
    .campo textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .campo textarea {
      resize: vertical;
      min-height: 80px;
    }

    .drop-zone {
      border: 2px dashed var(--border-light);
      border-radius: var(--radius);
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: background .2s, border-color .2s;
      position: relative;
    }

    .drop-zone.over {
      background: rgba(var(--accent-rgb, 100,180,255), 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    .drop-zone.has-file {
      background: rgba(45,122,48, 0.1);
      border-color: #2d7a30;
      color: #2d7a30;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-zone .icon {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 8px;
    }

    .drop-zone .file-name {
      font-weight: bold;
      word-break: break-all;
    }

    .progress-wrap {
      display: none;
      margin-top: 10px;
    }

    .progress-wrap progress {
      width: 100%;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      accent-color: var(--accent);
      border: none;
    }

    .progress-wrap span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: var(--radius);
      display: none;
      font-size: 14px;
    }

    .msg.ok {
      background: rgba(45,122,48,0.15);
      border: 1px solid #2d7a30;
      color: #5dba60;
    }

    .msg.erro {
      background: rgba(200,50,50,0.15);
      border: 1px solid #c03232;
      color: #e07070;
    }

    .link-level {
      display: block;
      margin-top: 8px;
      font-weight: bold;
      color: var(--yellow);
      text-decoration: none;
    }

    .aviso-login {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      padding: 20px 0;
    }

    .aviso-login a {
      color: var(--yellow);
    }
  </style>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">🎮 Pellizzola Brothers</a>
  <ul class="nav-links">
    <li><a href="index.html" data-i18n="nav.home">Home</a></li>
    <li><a href="levels.html" data-i18n="nav.fases">Levels</a></li>
    <li><a href="usuarios.html" data-i18n="nav.criadores">Criadores</a></li>
    <li><a href="download.html" data-i18n="nav.download">Download</a></li>
    <li><a href="little_coffee.html" data-i18n="nav.cafezinho">☕ Cafézinho</a></li>
    <li><a href="shop.html" class="active">🛒 Loja</a></li>
    <li><a href="login.html" id="nav-auth" data-i18n="nav.entrar">Entrar</a></li>
    <li>
      <form class="nav-search-form" onsubmit="navSearch(event)">
        <input class="nav-search-input" id="nav-search" type="text" data-i18n-ph="nav.buscar" placeholder="🔍 Buscar fases..." autocomplete="off">
      </form>
    </li>
  </ul>
</nav>

<div class="page">
  <div class="upload-card">
    <h1 data-i18n="upload.titulo">📤 Enviar Fase</h1>

    <p id="aviso-login" class="aviso-login" style="display:none;">
      <span data-i18n="upload.aviso_login">Você precisa estar logado para enviar uma fase.</span>
      <a href="login.html" data-i18n="upload.logado">logado</a>
    </p>

    <div id="form-upload">
      <div class="campo">
        <label for="nome" data-i18n="upload.nome_label">Nome da fase *</label>
        <input type="text" id="nome" data-i18n-ph="upload.nome_ph" placeholder="Ex: Minha Fase Incrível" maxlength="200" oninput="contarChars('nome',200,'count-nome')">
        <div style="font-size:11px;color:var(--text-muted);margin-top:3px;text-align:right;"><span id="count-nome">0</span>/200</div>
      </div>

      <div class="campo">
        <label for="desc" data-i18n="upload.desc_label">Descrição</label>
        <textarea id="desc" data-i18n-ph="upload.desc_ph" placeholder="Conte um pouco sobre a fase..." maxlength="1000" oninput="contarChars('desc',1000,'count-desc')"></textarea>
        <div style="font-size:11px;color:var(--text-muted);margin-top:3px;text-align:right;"><span id="count-desc">0</span>/1000</div>
      </div>

      <div class="campo">
        <label data-i18n="upload.arquivo_label">Arquivo da fase *</label>
        <div class="drop-zone" id="drop-zone">
          <input type="file" id="arquivo" accept="*/*">
          <span class="icon">📁</span>
          <span id="drop-texto" data-i18n="upload.drop_texto">Clique ou arraste o arquivo aqui</span>
          <br><small style="font-size:11px;color:var(--text-dim);" data-i18n="upload.drop_max">Tamanho máximo: 10 MB</small>
        </div>
      </div>

      <div class="progress-wrap" id="progress-wrap">
        <progress id="barra" value="0" max="100"></progress>
        <span id="pct">0%</span>
      </div>

      <button class="btn btn-green" style="width:100%;margin-top:4px;" id="btn-enviar" onclick="enviar()" data-i18n="upload.btn_enviar">
        Enviar Fase
      </button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
</div>

<script>

var usuario = getUser();

if (usuario != null) {
  document.getElementById('nav-auth').textContent = usuario.username.toUpperCase();
  document.getElementById('nav-auth').href = 'perfil_do_usuario.html?id=' + usuario.id;
} else {
  document.getElementById('form-upload').style.display = 'none';
  document.getElementById('aviso-login').style.display = '';
}

var dropZone = document.getElementById('drop-zone');
var inputArq = document.getElementById('arquivo');

dropZone.addEventListener('dragover', function(e) {
  e.preventDefault();
  dropZone.classList.add('over');
});

dropZone.addEventListener('dragleave', function() {
  dropZone.classList.remove('over');
});

dropZone.addEventListener('drop', function(e) {
  e.preventDefault();
  dropZone.classList.remove('over');
  if (e.dataTransfer.files.length > 0) {
    inputArq.files = e.dataTransfer.files;
    mostrarArquivo(e.dataTransfer.files[0]);
  }
});

inputArq.addEventListener('change', function() {
  if (inputArq.files.length > 0) mostrarArquivo(inputArq.files[0]);
});

function contarChars(inputId, max, countId) {
  var val = document.getElementById(inputId).value.length;
  var el  = document.getElementById(countId);
  if (el) {
    el.textContent = val;
    el.style.color = val > max * 0.9 ? 'var(--accent)' : 'var(--text-muted)';
  }
}

function mostrarArquivo(file) {
  dropZone.classList.add('has-file');
  dropZone.classList.remove('over');
  var tamanhoStr = file.size >= 1024 * 1024
    ? (file.size / (1024 * 1024)).toFixed(2) + ' MB'
    : (file.size / 1024).toFixed(1) + ' KB';
  document.getElementById('drop-texto').innerHTML =
    '<span class="file-name">' + file.name + '</span>' +
    '<br><small>' + tamanhoStr + '</small>';
}

function enviar() {
  var nome    = document.getElementById('nome').value.trim();
  var desc    = document.getElementById('desc').value.trim();
  var arquivo = inputArq.files[0];

  if (!nome)              { mostrarMsg('erro', t('upload.err_nome')); return; }
  if (nome.length < 3)    { mostrarMsg('erro', t('upload.err_nome_curto')); return; }
  if (!arquivo)           { mostrarMsg('erro', t('upload.err_arquivo')); return; }
  if (arquivo.size > 10 * 1024 * 1024) {
    mostrarMsg('erro', t('upload.err_tamanho'));
    return;
  }

  var formData = new FormData();
  formData.append('file',        arquivo);
  formData.append('name',        nome);
  formData.append('description', desc);

  var btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  btn.textContent = t('upload.enviando');

  var progressWrap = document.getElementById('progress-wrap');
  var barra = document.getElementById('barra');
  var pct   = document.getElementById('pct');
  progressWrap.style.display = '';

  var xhr = new XMLHttpRequest();

  xhr.upload.addEventListener('progress', function(e) {
    if (e.lengthComputable) {
      var percent = Math.round((e.loaded / e.total) * 100);
      barra.value = percent;
      pct.textContent = percent + '%';
    }
  });

  xhr.addEventListener('load', function() {
    btn.disabled = false;
    btn.textContent = t('upload.btn_enviar');
    progressWrap.style.display = 'none';

    var dados;
    try { dados = JSON.parse(xhr.responseText); } catch(e) { dados = {}; }

    if (xhr.status === 201 && dados.ok) {
      mostrarMsg('ok',
        '✅ ' + t('entity.fase') + ' <strong>' + dados.level.name + '</strong> ' + t('upload.ok_msg')
      );
      setTimeout(function() {
        window.location.href = 'perfil_do_jogo.html?id=' + dados.level.id;
      }, 1800);
    } else {
      mostrarMsg('erro', t('upload.err_servidor') + ' ' + (dados.error || ''));
    }
  });

  xhr.addEventListener('error', function() {
    btn.disabled = false;
    btn.textContent = t('upload.btn_enviar');
    progressWrap.style.display = 'none';
    mostrarMsg('erro', t('upload.err_conexao'));
  });

  xhr.open('POST', API + '/upload/level');
  var token = getToken();
  if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
  xhr.send(formData);
}

function mostrarMsg(tipo, html) {
  var el = document.getElementById('msg');
  el.className = 'msg ' + tipo;
  el.innerHTML = html;
  el.style.display = '';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
</script>
<script>
function navSearch(e) {
  e.preventDefault();
  var q = document.getElementById("nav-search").value.trim();
  if (q) window.location.href = "levels.html?q=" + encodeURIComponent(q);
}
</script>
<script>
(function(){
  var b = document.querySelector(".nav-brand");
  if (b) {
    b.addEventListener("click", function(e) {
      var n = parseInt(sessionStorage.getItem("pb_brand_clicks") || "0") + 1;
      if (n >= 9) {
        sessionStorage.removeItem("pb_brand_clicks");
        e.preventDefault();
        window.location.href = "creditos.html";
      } else {
        sessionStorage.setItem("pb_brand_clicks", n);
      }
    });
  }
  var seq = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
  var idx = 0;
  document.addEventListener("keydown", function(e) {
    if (e.key === seq[idx]) {
      idx++;
      if (idx === seq.length) { idx = 0; window.location.href = "admin.html"; }
    } else {
      idx = (e.key === seq[0]) ? 1 : 0;
    }
  });
})();
</script>
</body>
</html>
