<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quebra de Código</title>
<style>
  /* ---------- Cores e fontes usadas em todo o site, guardadas em "variáveis" ---------- */
  :root{
    --bg: #0a0e0a;
    --panel: #10160f;
    --line: #1e2a1c;
    --green: #4ade80;
    --green-dim: #2f8f57;
    --amber: #f5a524;
    --red: #ef4444;
    --text: #d7e6d2;
    --text-dim: #6b8168;
    --mono: 'Courier New', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: var(--mono);
    min-height:100vh;
    padding:32px 16px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(74,222,128,0.05), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(74,222,128,0.04), transparent 40%);
  }
  .wrap{max-width:640px;margin:0 auto;}

  .crt-title{
    font-size:14px;
    letter-spacing:4px;
    color:var(--green-dim);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  h1{
    font-size:clamp(28px,6vw,42px);
    margin:0 0 6px 0;
    color:var(--green);
    text-shadow:0 0 12px rgba(74,222,128,0.35);
    letter-spacing:1px;
  }
  .subtitle{
    color:var(--text-dim);
    font-size:14px;
    margin-bottom:32px;
    border-left:2px solid var(--green-dim);
    padding-left:10px;
  }

  /* ---------- Caixas (painéis) que agrupam cada seção da página ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:2px;
    padding:20px;
    margin-bottom:16px;
  }
  .panel-label{
    font-size:11px;
    letter-spacing:3px;
    color:var(--green-dim);
    text-transform:uppercase;
    margin-bottom:14px;
  }

  input[type="text"]{
    width:100%;
    background:#050705;
    border:1px solid var(--line);
    color:var(--green);
    font-family:var(--mono);
    font-size:16px;
    padding:12px 14px;
    border-radius:2px;
    outline:none;
  }
  input[type="text"]:focus{border-color:var(--green-dim);}

  /* ---------- Estilo dos botões de opção (tamanho e charset) ---------- */
  .btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .opt-btn{
    flex:1 1 auto;
    min-width:56px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:var(--mono);
    font-size:13px;
    padding:10px 6px;
    border-radius:2px;
    cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .opt-btn:hover{border-color:var(--green-dim); color:var(--text);}
  /* .active é a classe que marca visualmente qual botão está selecionado */
  .opt-btn.active{
    background:rgba(74,222,128,0.1);
    border-color:var(--green);
    color:var(--green);
  }
  .opt-btn.wide{flex:1 1 100%;}

  .run-btn{
    width:100%;
    margin-top:8px;
    background:var(--green);
    color:#04140a;
    border:none;
    font-family:var(--mono);
    font-weight:bold;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:14px;
    padding:16px;
    border-radius:2px;
    cursor:pointer;
    transition:filter .15s;
  }
  .run-btn:hover{filter:brightness(1.1);}
  .run-btn:disabled{background:var(--text-dim); cursor:not-allowed;}

  /* ---------- A "telinha" preta onde o resultado aparece ---------- */
  .console{
    background:#050705;
    border:1px solid var(--line);
    border-radius:2px;
    padding:16px;
    font-size:13px;
    line-height:1.7;
    white-space:pre-wrap;
    min-height:120px;
    color:var(--green);
  }
  .console .fail{color:var(--red);}
  .console .warn{color:var(--amber);}
  .console .dim{color:var(--text-dim);}

  .cursor{
    display:inline-block;
    width:8px;height:14px;
    background:var(--green);
    vertical-align:middle;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  /* ---------- Barra de progresso ---------- */
  .bar-wrap{
    height:6px;
    background:#050705;
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
    margin-top:10px;
  }
  .bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--green-dim),var(--green));
    transition:width .1s linear;
  }

  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:11px;
    margin-top:24px;
    letter-spacing:1px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="crt-title">SISTEMA // CShp_ForcaBruta</div>
  <h1>Quebra de Código</h1>
  <p class="subtitle">Escolha uma senha e os parâmetros de teste. O sistema vai tentar todas as combinações até encontrar a correspondência.</p>

  <!-- Campo onde o usuário digita a senha que quer testar -->
  <div class="panel">
    <div class="panel-label">01 · Senha alvo</div>
    <input type="text" id="senhaInput" placeholder="digite a senha a testar..." autocomplete="off">
    <div class="btn-row">
      <button class="opt-btn wide" id="randomBtn" type="button">🎲 gerar senha aleatória</button>
    </div>
  </div>

  <!-- Botões de tamanho: cada um guarda seu valor em data-tam -->
  <div class="panel">
    <div class="panel-label">02 · Tamanho da senha</div>
    <div class="btn-row" id="tamanhoBtns">
      <button class="opt-btn" data-tam="3">3</button>
      <button class="opt-btn active" data-tam="4">4</button>
      <button class="opt-btn" data-tam="5">5</button>
      <button class="opt-btn" data-tam="6">6</button>
    </div>
  </div>

  <!-- Botões de charset: cada um guarda a lista de caracteres em data-chars -->
  <div class="panel">
    <div class="panel-label">03 · Conjunto de caracteres</div>
    <div class="btn-row" id="charsetBtns">
      <button class="opt-btn wide active" data-set="1" data-chars="0123456789">1 — Somente números</button>
      <button class="opt-btn wide" data-set="2" data-chars="0123456789abcdefghijklmnopqrstuvwxyz">2 — Números e letras</button>
      <button class="opt-btn wide" data-set="3" data-chars="0123456789abcdefghijklmnopqrstuvwxyz!@#$%&amp;*">3 — Números, letras e símbolos</button>
    </div>
  </div>

  <button class="run-btn" id="runBtn">crique aqui &gt; iniciar quebra</button>

  <!-- Aqui o resultado (e a barra de progresso) aparecem -->
  <div class="panel" style="margin-top:16px;">
    <div class="panel-label">saída</div>
    <div class="console" id="output">aguardando comando<span class="cursor"></span></div>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
  </div>

  <footer>ESCOLHA UM DOS 3 · CShp_ForcaBruta</footer>
</div>

<script>
// ======================================================
// "MEMÓRIA" da página: guarda o que está selecionado agora
// ======================================================
let tamanhoEscolhido = 4;              // tamanho padrão ao carregar a página
let charsetEscolhido = "0123456789";   // charset padrão ao carregar a página

// ------------------------------------------------------
// Liga um "clique" em cada botão de TAMANHO.
// Quando clicado: tira o destaque dos outros, destaca este,
// e atualiza a variável tamanhoEscolhido.
// ------------------------------------------------------
document.querySelectorAll('#tamanhoBtns .opt-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#tamanhoBtns .opt-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    tamanhoEscolhido = parseInt(btn.dataset.tam); // lê o valor guardado em data-tam e converte pra número
  });
});

// ------------------------------------------------------
// Mesma ideia, mas para os botões de CHARSET.
// ------------------------------------------------------
document.querySelectorAll('#charsetBtns .opt-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#charsetBtns .opt-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    charsetEscolhido = btn.dataset.chars; // lê o texto guardado em data-chars
  });
});

// Pega referências dos elementos da página pelo id, pra poder manipular eles no código.
const runBtn = document.getElementById('runBtn');
const output = document.getElementById('output');
const bar = document.getElementById('bar');
const randomBtn = document.getElementById('randomBtn');
const senhaInput = document.getElementById('senhaInput');

// ------------------------------------------------------
// Botão "gerar senha aleatória":
// sorteia um caractere do charset escolhido, tamanhoEscolhido vezes,
// e escreve o resultado no campo de senha.
// ------------------------------------------------------
randomBtn.addEventListener('click', ()=>{
  let senhaAleatoria = '';
  for(let i=0;i<tamanhoEscolhido;i++){
    const idx = Math.floor(Math.random() * charsetEscolhido.length); // índice aleatório válido
    senhaAleatoria += charsetEscolhido[idx];                          // gruda o caractere sorteado
  }
  senhaInput.value = senhaAleatoria; // mostra o resultado no campo de texto
});

// Função pequena só pra não repetir "output.innerHTML = ..." toda hora
function log(html){
  output.innerHTML = html;
}

// ======================================================
// Botão principal: "crique aqui > iniciar quebra"
// ======================================================
runBtn.addEventListener('click', async ()=>{
  const senha = senhaInput.value.toLowerCase(); // pega a senha digitada e deixa minúscula

  if(!senha){
    log('<span class="fail">&gt; erro: informe uma senha antes de iniciar</span>');
    return; // para a função aqui, nem começa a busca
  }

  // Só um aviso (não impede de rodar): se o tamanho da senha digitada
  // não bate com o tamanho escolhido nos botões, ela nunca vai ser encontrada.
  if(senha.length !== tamanhoEscolhido){
    log(`<span class="warn">&gt; aviso: a senha tem ${senha.length} caractere(s), mas o tamanho escolhido é ${tamanhoEscolhido}.</span>\n<span class="dim">a busca não vai encontrar a senha se o tamanho não bater.</span>`);
  }

  // Prepara a tela: desativa o botão (evita clique duplo) e zera a barra de progresso
  runBtn.disabled = true;
  runBtn.textContent = 'quebrando...';
  bar.style.width = '0%';
  log('&gt; iniciando força bruta<span class="cursor"></span>');

  const charset = charsetEscolhido;
  const tamanho = tamanhoEscolhido;

  // Quantas combinações existem no total: charset.length elevado à potência do tamanho.
  // Ex: 10 dígitos, tamanho 4 -> 10^4 = 10000 combinações possíveis.
  const totalCombinacoes = Math.pow(charset.length, tamanho);

  let tentativas = 0;
  let encontrada = false;
  const inicio = performance.now(); // marca o "tempo zero" pra depois calcular quanto levou

  // "indices" funciona como um hodômetro de carro: cada posição guarda
  // QUAL caractere do charset está sendo usado ali. Começa tudo em 0
  // (ou seja, a primeira combinação é sempre o primeiro caractere repetido).
  const indices = new Array(tamanho).fill(0);

  // Avança pra próxima combinação, tipo somar 1 no hodômetro.
  // Se a última posição "estoura" o tamanho do charset, ela volta a 0
  // e soma 1 na posição anterior (o "vai um" da soma manual).
  function proximo(){
    for(let i = tamanho - 1; i >= 0; i--){
      indices[i]++;
      if(indices[i] < charset.length) return true; // ainda cabe, pode parar aqui
      indices[i] = 0; // estourou, zera essa posição e vai ajustar a anterior
    }
    return false; // já passou por TODAS as combinações possíveis
  }

  // Transforma o array de índices [0,0,0,0] em uma string tipo "0000",
  // usando os índices pra buscar os caracteres reais no charset.
  function montaAtual(){
    let s = '';
    for(let i=0;i<tamanho;i++) s += charset[indices[i]];
    return s;
  }

  // A busca roda dentro de uma Promise pra poder "pausar" de vez em quando
  // (com setTimeout) e não travar a página inteira enquanto testa milhares de combinações.
  await new Promise(resolve=>{
    function passo(){
      const LOTE = 20000; // quantas tentativas fazer antes de dar uma respirada

      for(let i=0;i<LOTE;i++){
        tentativas++;
        const atual = montaAtual();

        if(atual === senha){       // achou a senha!
          encontrada = true;
          break;
        }
        if(!proximo()){             // não tem mais combinação pra testar
          break;
        }
      }

      // Atualiza a barra de progresso visual
      const progresso = Math.min(100, (tentativas / totalCombinacoes) * 100);
      bar.style.width = progresso.toFixed(1) + '%';

      if(encontrada || tentativas >= totalCombinacoes){
        resolve(); // termina a Promise, a busca acabou (achou ou esgotou tudo)
      } else {
        setTimeout(passo, 0); // agenda o próximo "lote" de tentativas, sem travar a tela
      }
    }
    passo(); // começa o primeiro lote
  });

  const fim = performance.now();
  const tempoGasto = (fim - inicio) / 1000; // milissegundos -> segundos

  // ---------------------------------------------------
  // Mostra o resultado final na tela
  // ---------------------------------------------------
  if(encontrada){
    const senhasPorSegundo = tempoGasto > 0 ? Math.round(tentativas / tempoGasto) : tentativas;
    log(
`<span class="fail" style="color:var(--green)">&gt; senha quebrada!</span>
----------------------------------
senha: ${senha}
tamanho: ${tamanho}
tentativas: ${tentativas}
tempo gasto: ${tempoGasto.toFixed(3)} segundos
senhas por segundo: ${senhasPorSegundo}`
    );
    bar.style.width = '100%';
  } else {
    log(
`<span class="fail">&gt; não foi possível quebrar a senha com essas opções.</span>
tentativas: ${tentativas}
tempo gasto: ${tempoGasto.toFixed(3)} segundos
<span class="dim">verifique se o tamanho e o conjunto de caracteres batem com a senha digitada.</span>`
    );
  }

  // Reativa o botão pra poder rodar de novo
  runBtn.disabled = false;
  runBtn.textContent = 'crique aqui > iniciar quebra';
});
</script>
</body>
</html>
