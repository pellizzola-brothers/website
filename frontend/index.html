<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — Pellizzola Brothers</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── HOME LAYOUT — inspirado no Super Mario Maker Course World ── */

    .home-wrap {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 16px;
      align-items: start;
    }

    /* ── PAINEL PRINCIPAL (esquerda) ── */
    .main-panel {}

    /* Cabeçalho do painel: saudação + abas de categoria */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .panel-greeting {
      font-family: var(--font-title);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text);
    }

    .panel-tabs {
      display: flex;
      gap: 4px;
    }

    .panel-tab {
      padding: 5px 14px;
      font-family: var(--font-title);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
    }

    .panel-tab.active {
      color: var(--bg-nav);
      background: var(--yellow);
      border-color: var(--yellow);
    }

    /* ── NÍVEL EM DESTAQUE — card grande no topo ── */
    .featured-big {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 14px;
      display: grid;
      grid-template-columns: 220px 1fr;
    }

    .featured-big-thumb {
      height: 160px;
      background: linear-gradient(160deg, #0d3a0d 0%, #0a2040 55%, #200d3a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      border-right: 2px solid var(--border);
    }

    .featured-big-body {
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .featured-big-badge {
      display: inline-block;
      padding: 2px 10px;
      background: var(--yellow);
      color: var(--bg-nav);
      font-family: var(--font-title);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: var(--radius);
      margin-bottom: 8px;
      width: fit-content;
    }

    .featured-big-name {
      font-family: var(--font-title);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 4px;
    }

    .featured-big-desc {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 12px;
    }

    .featured-big-stats {
      display: flex;
      gap: 18px;
      margin-bottom: 14px;
    }

    .featured-big-stat {
      font-size: 13px;
      color: var(--text-muted);
    }

    .featured-big-stat strong {
      color: var(--text);
    }

    .featured-big-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* ── GRADE DE NÍVEIS — estilo "Course World" do Mario Maker ── */
    .course-world-title {
      font-family: var(--font-title);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .course-world-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .course-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .course-card-thumb {
      height: 72px;
      background: linear-gradient(160deg, #0d3a0d 0%, #0a2040 55%, #200d3a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      border-bottom: 2px solid var(--border);
      position: relative;
    }

    .course-card-rank {
      position: absolute;
      top: 5px;
      left: 7px;
      font-family: var(--font-title);
      font-size: 10px;
      font-weight: 700;
      color: var(--yellow);
      background: rgba(0,0,0,0.5);
      padding: 1px 5px;
      border-radius: 3px;
    }

    .course-card-body {
      padding: 8px 10px;
      flex: 1;
    }

    .course-card-name {
      font-family: var(--font-title);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .course-card-author {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .course-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(0,0,0,0.15);
    }

    /* ── PAINEL LATERAL (direita) ── */
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Criador em destaque */
    .creator-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .creator-card-header {
      background: var(--bg-nav);
      border-bottom: 2px solid var(--border);
      padding: 8px 12px;
      font-family: var(--font-title);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--yellow);
    }

    .creator-card-body {
      padding: 14px;
      text-align: center;
    }

    .creator-avatar {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #1a3a5a 0%, #2a1a5a 100%);
      border: 2px solid var(--border-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 10px;
    }

    .creator-name {
      font-family: var(--font-title);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 3px;
    }

    .creator-bio {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 10px;
    }

    .creator-stats-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .creator-stat {
      text-align: center;
    }

    .creator-stat-val {
      font-family: var(--font-title);
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      display: block;
    }

    .creator-stat-lbl {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* Mini níveis do criador */
    .creator-levels-title {
      font-family: var(--font-title);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 8px 12px 4px;
      border-top: 1px solid var(--border);
    }

    .creator-level-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-top: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
    }

    .creator-level-icon {
      width: 32px;
      height: 24px;
      background: linear-gradient(135deg, #1a4a1a 0%, #0a2040 100%);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      border: 1px solid var(--border-light);
    }

    .creator-level-name {
      font-family: var(--font-title);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .creator-level-dl {
      font-size: 10px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* Link rápido */
    .side-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      text-decoration: none;
      color: var(--text);
    }

    .side-link-label {
      font-family: var(--font-title);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .side-link-arrow {
      color: var(--accent);
      font-size: 16px;
    }

    @media (max-width: 860px) {
      .home-wrap { grid-template-columns: 1fr; }
      .side-panel { order: -1; }
      .featured-big { grid-template-columns: 1fr; }
      .featured-big-thumb { height: 120px; border-right: none; border-bottom: 2px solid var(--border); }
      .course-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">🎮 Pellizzola Brothers</a>
  <ul class="nav-links">
    <li><a href="index.html" class="active">Home</a></li>
    <li><a href="niveis.html">Níveis</a></li>
    <li><a href="login.html" id="nav-auth">Entrar</a></li>
  </ul>
</nav>

<div class="page">
  <div class="home-wrap">

    <!-- ── PAINEL PRINCIPAL ── -->
    <div class="main-panel">

      <div class="panel-header">
        <div class="panel-greeting" id="greeting">Boa tarde, Visitante!</div>
      </div>

      <!-- Nível em destaque — card grande -->
      <div id="featured-big-wrap">
        <div class="featured-big">
          <div class="featured-big-thumb skeleton"></div>
          <div class="featured-big-body">
            <div class="skeleton" style="height:14px;width:80px;margin-bottom:10px;border-radius:3px;"></div>
            <div class="skeleton" style="height:20px;width:70%;margin-bottom:6px;"></div>
            <div class="skeleton" style="height:12px;width:50%;margin-bottom:14px;"></div>
            <div class="skeleton" style="height:12px;width:40%;margin-bottom:4px;"></div>
            <div class="skeleton" style="height:12px;width:35%;margin-bottom:16px;"></div>
            <div class="skeleton" style="height:32px;width:110px;"></div>
          </div>
        </div>
      </div>

      <!-- Grade de níveis recentes -->
      <div class="course-world-title">Níveis Recentes</div>
      <div class="course-grid" id="course-grid">
        <div class="course-card"><div class="course-card-thumb skeleton" style="height:72px;"></div><div class="course-card-body"><div class="skeleton" style="height:12px;width:80%;margin-bottom:5px;"></div><div class="skeleton" style="height:10px;width:55%;"></div></div></div>
        <div class="course-card"><div class="course-card-thumb skeleton" style="height:72px;"></div><div class="course-card-body"><div class="skeleton" style="height:12px;width:65%;margin-bottom:5px;"></div><div class="skeleton" style="height:10px;width:45%;"></div></div></div>
        <div class="course-card"><div class="course-card-thumb skeleton" style="height:72px;"></div><div class="course-card-body"><div class="skeleton" style="height:12px;width:75%;margin-bottom:5px;"></div><div class="skeleton" style="height:10px;width:50%;"></div></div></div>
        <div class="course-card"><div class="course-card-thumb skeleton" style="height:72px;"></div><div class="course-card-body"><div class="skeleton" style="height:12px;width:60%;margin-bottom:5px;"></div><div class="skeleton" style="height:10px;width:40%;"></div></div></div>
        <div class="course-card"><div class="course-card-thumb skeleton" style="height:72px;"></div><div class="course-card-body"><div class="skeleton" style="height:12px;width:70%;margin-bottom:5px;"></div><div class="skeleton" style="height:10px;width:48%;"></div></div></div>
        <div class="course-card"><div class="course-card-thumb skeleton" style="height:72px;"></div><div class="course-card-body"><div class="skeleton" style="height:12px;width:55%;margin-bottom:5px;"></div><div class="skeleton" style="height:10px;width:38%;"></div></div></div>
      </div>

    </div>

    <!-- ── PAINEL LATERAL ── -->
    <div class="side-panel">

      <!-- Criador em destaque -->
      <div class="creator-card" id="creator-card">
        <div class="creator-card-header">★ Criador em Destaque</div>
        <div class="creator-card-body">
          <div class="creator-avatar skeleton" style="width:64px;height:64px;border-radius:50%;margin:0 auto 10px;"></div>
          <div class="skeleton" style="height:14px;width:60%;margin:0 auto 6px;"></div>
          <div class="skeleton" style="height:11px;width:45%;margin:0 auto 10px;"></div>
        </div>
      </div>



    </div>

  </div>
</div>

<script>
const API = 'http://localhost:3000/api';
const EMOJIS = ['🌴','🎯','🎵','⭐','🏆','🍄','🎮','🔷','🧩','🎪'];
const emojiFor = function(id) { return EMOJIS[(id - 1) % EMOJIS.length]; };

function getGreeting(name) {
  const h = new Date().getHours();
  const p = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  return p + ', ' + name + '!';
}

const user = JSON.parse(sessionStorage.getItem('pb_user') || 'null');
if (user) {
  document.getElementById('greeting').textContent = getGreeting(user.username.toUpperCase());
  document.getElementById('nav-auth').textContent = user.username.toUpperCase();
  document.getElementById('nav-auth').href = 'perfil_do_usuario.html?id=' + user.id;
} else {
  document.getElementById('greeting').textContent = getGreeting('Visitante');
}

async function loadHome() {
  let levels = [], featured = null, creator = null;
  try {
    levels   = await fetch(API + '/levels').then(function(r){ return r.json(); });
    featured = await fetch(API + '/levels/featured').then(function(r){ return r.json(); });
    creator  = await fetch(API + '/users/' + featured.author_id).then(function(r){ return r.json(); });
  } catch(e) {
    levels   = [
      {id:1,name:'Meu Nivel Bacana',description:'Bacanices Bananas',downloads:11,likes:10,author_name:'xx_poste_xx'},
      {id:2,name:'Meu Nivel Bacana 2',description:'Os dentes de Berenice',downloads:11,likes:9,author_name:'xx_poste_xx'},
      {id:3,name:'A Extraordinaria Jornada de Henrique',description:'Um clássico!',downloads:0,likes:0,author_name:'BillyShears'},
      {id:4,name:'Revolver',description:'The one and only Billy Shears!',downloads:8,likes:6,author_name:'BillyShears'},
      {id:5,name:'Eu Acompanho as Botas Douradas',description:'Bacanices',downloads:3,likes:2,author_name:'JacaboMassola'},
    ];
    featured = levels[0];
    creator  = {id:1, username:'xx_poste_xx', bio:'Viva Jesus', downloaded_levels:11, liked_levels:9, levels:[levels[0],levels[1]]};
  }

  /* ── Nível em destaque ── */
  document.getElementById('featured-big-wrap').innerHTML =
    '<div class="featured-big">' +
      '<div class="featured-big-thumb">' + emojiFor(featured.id) + '</div>' +
      '<div class="featured-big-body">' +
        '<div class="featured-big-badge">★ Em Destaque</div>' +
        '<div class="featured-big-name">' + featured.name + '</div>' +
        '<div class="featured-big-desc">' + (featured.description ? '"' + featured.description + '"' : '') + '</div>' +
        '<div class="featured-big-stats">' +
          '<div class="featured-big-stat">⬇ Downloads: <strong>' + featured.downloads + '</strong></div>' +
          '<div class="featured-big-stat">♥ Curtidas: <strong>' + featured.likes + '</strong></div>' +
        '</div>' +
        '<div class="featured-big-actions">' +
          '<a href="perfil_do_jogo.html?id=' + featured.id + '" class="btn btn-green btn-sm">Download</a>' +
        '</div>' +
      '</div>' +
    '</div>';

  /* ── Grade de níveis recentes ── */
  var others = levels.filter(function(l){ return l.id !== featured.id; });
  var gridHTML = others.slice(0, 6).map(function(l, i) {
    return '<a href="perfil_do_jogo.html?id=' + l.id + '" class="course-card">' +
      '<div class="course-card-thumb">' +
        '<span class="course-card-rank">#' + (i + 1) + '</span>' +
        emojiFor(l.id) +
      '</div>' +
      '<div class="course-card-body">' +
        '<div class="course-card-name">' + l.name + '</div>' +
        '<div class="course-card-author">por ' + l.author_name + '</div>' +
      '</div>' +
      '<div class="course-card-footer">' +
        '<span>⬇ ' + l.downloads + '</span>' +
        '<span>♥ ' + l.likes + '</span>' +
      '</div>' +
    '</a>';
  }).join('');

  document.getElementById('course-grid').innerHTML = gridHTML;

  /* ── Criador em destaque ── */
  var crLevels = (creator.levels || []).slice(0, 3).map(function(l) {
    return '<a href="perfil_do_jogo.html?id=' + l.id + '" class="creator-level-row">' +
      '<div class="creator-level-icon">' + emojiFor(l.id) + '</div>' +
      '<div class="creator-level-name">' + l.name + '</div>' +
      '<div class="creator-level-dl">⬇ ' + (l.downloads || 0) + '</div>' +
    '</a>';
  }).join('');

  document.getElementById('creator-card').innerHTML =
    '<div class="creator-card-header">★ Criador em Destaque</div>' +
    '<div class="creator-card-body">' +
      '<div class="creator-avatar">👤</div>' +
      '<div class="creator-name">' + creator.username + '</div>' +
      '<div class="creator-bio">' + (creator.bio ? '"' + creator.bio + '"' : '') + '</div>' +
      '<div class="creator-stats-row">' +
        '<div class="creator-stat"><span class="creator-stat-val">' + (creator.levels||[]).length + '</span><span class="creator-stat-lbl">Níveis</span></div>' +
        '<div class="creator-stat"><span class="creator-stat-val">' + creator.downloaded_levels + '</span><span class="creator-stat-lbl">Plays</span></div>' +
        '<div class="creator-stat"><span class="creator-stat-val">' + creator.liked_levels + '</span><span class="creator-stat-lbl">Likes</span></div>' +
      '</div>' +
      '<a href="perfil_do_usuario.html?id=' + creator.id + '" class="btn btn-outline btn-sm" style="width:100%;text-align:center;">Ver perfil</a>' +
    '</div>' +
    (crLevels ? '<div class="creator-levels-title">Níveis criados</div>' + crLevels : '');
}

loadHome();
</script>
</body>
</html>
